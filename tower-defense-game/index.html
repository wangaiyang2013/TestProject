<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>塔防大战</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <header id="top-bar">
      <div class="stat-group">
        <span class="stat-label">阳光</span>
        <span id="sun-count" class="stat-value">150</span>
      </div>
      <div class="stat-group">
        <span class="stat-label">波次</span>
        <span id="wave-count" class="stat-value">1</span>
      </div>
      <div class="stat-group">
        <span class="stat-label">击杀</span>
        <span id="kill-count" class="stat-value">0</span>
      </div>
    </header>

    <div id="plant-bar">
      <button type="button" class="plant-card" data-plant="snakeSculpture">
        <span class="plant-icon snake-sculpture-icon"></span>
        <span class="plant-name">蛇形雕塑</span>
        <span class="plant-cost">100</span>
      </button>
      <button type="button" class="plant-card" data-plant="snakeSunflower">
        <span class="plant-icon snake-sunflower-icon"></span>
        <span class="plant-name">蛇阳花</span>
        <span class="plant-cost">50</span>
      </button>
      <button type="button" class="plant-card" data-plant="snakeBarrier">
        <span class="plant-icon snake-barrier-icon"></span>
        <span class="plant-name">蛇障</span>
        <span class="plant-cost">50</span>
      </button>
      <button type="button" class="plant-card" data-plant="snakeStake">
        <span class="plant-icon snake-stake-icon"></span>
        <span class="plant-name">蛇坚桩</span>
        <span class="plant-cost">50</span>
      </button>
      <button type="button" class="plant-card" data-plant="snakeSlowSculpture">
        <span class="plant-icon snake-slow-sculpture-icon"></span>
        <span class="plant-name">缓蛇雕塑</span>
        <span class="plant-cost">100</span>
      </button>
      <button type="button" class="plant-card" data-plant="snakeRechargeSculpture">
        <span class="plant-icon snake-recharge-sculpture-icon"></span>
        <span class="plant-name">蓄蛇雕塑</span>
        <span class="plant-cost">150</span>
      </button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="overlay" class="overlay visible">
      <div class="overlay-panel">
        <h1>塔防大战</h1>
        <p class="overlay-desc">
          战场共 <strong>5 条路</strong>、<strong>26 列</strong> 长距离场地。<br>
          放置 6 种蛇系植物，阻止小怪物从右侧向左进攻。<br>
          小怪物生命值为 <strong>270</strong>，无特殊能力。<br>
          最左侧有小推车：敌人接触后会清掉该路全部敌人。<br>
          若敌人抵达最左端，游戏失败。
        </p>
        <button id="start-btn" type="button" class="btn-primary">开始游戏</button>
      </div>
    </div>

    <div id="game-over-overlay" class="overlay hidden">
      <div class="overlay-panel">
        <h1 id="game-over-title">游戏结束</h1>
        <p id="game-over-message"></p>
        <button id="restart-btn" type="button" class="btn-primary">再来一局</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
