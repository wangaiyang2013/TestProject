<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>塔防大战</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <header id="top-bar">
      <div class="stat-group">
        <span class="stat-label">阳光</span>
        <span id="sun-count" class="stat-value">150</span>
      </div>
      <div class="stat-group">
        <span class="stat-label">波次</span>
        <span id="wave-count" class="stat-value">1</span>
      </div>
      <div class="stat-group">
        <span class="stat-label">击杀</span>
        <span id="kill-count" class="stat-value">0</span>
      </div>
    </header>

    <div id="plant-bar">
      <button type="button" class="plant-card" data-plant="snakeHeadSculptor">
        <span class="plant-icon snake-head-icon"></span>
        <span class="plant-name">蛇形雕首</span>
        <span class="plant-cost">100</span>
      </button>
      <button type="button" class="plant-card" data-plant="smallKitchen">
        <span class="plant-icon small-kitchen-icon"></span>
        <span class="plant-name">小厨局</span>
        <span class="plant-cost">50</span>
      </button>
      <button type="button" class="plant-card" data-plant="bigIronPlate">
        <span class="plant-icon big-iron-plate-icon"></span>
        <span class="plant-name">大铁板</span>
        <span class="plant-cost">50</span>
      </button>
      <button type="button" class="plant-card" data-plant="bigNuclearBomb">
        <span class="plant-icon big-nuclear-bomb-icon"></span>
        <span class="plant-name">大核弹</span>
        <span class="plant-cost">150</span>
      </button>
      <button type="button" class="plant-card" data-plant="bigIceHorn">
        <span class="plant-icon big-ice-horn-icon"></span>
        <span class="plant-name">大汉角</span>
        <span class="plant-cost">175</span>
      </button>
      <button type="button" class="plant-card" data-plant="battleEngine">
        <span class="plant-icon battle-engine-icon"></span>
        <span class="plant-name">战斗引擎</span>
        <span class="plant-cost">150</span>
      </button>
    </div>

    <div id="status-tip" class="status-tip hidden"></div>

    <canvas id="game-canvas"></canvas>

    <div id="overlay" class="overlay visible">
      <div class="overlay-panel">
        <h1>塔防大战</h1>
        <p class="overlay-desc">
          战场共 <strong>5 条路</strong>、<strong>26 列</strong> 长距离场地。<br>
          阻止小怪物从右侧向左进攻，敌人生命 <strong>270</strong>。<br>
          最左侧小推车接触敌人可清整路，抵达最左端则失败。
        </p>
        <button id="start-btn" type="button" class="btn-primary">开始游戏</button>
      </div>
    </div>

    <div id="game-over-overlay" class="overlay hidden">
      <div class="overlay-panel">
        <h1 id="game-over-title">游戏结束</h1>
        <p id="game-over-message"></p>
        <button id="restart-btn" type="button" class="btn-primary">再来一局</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
