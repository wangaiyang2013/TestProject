<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏合集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 1.5rem;
    }
    main {
      width: min(100%, 28rem);
      padding: 2rem;
      background: rgba(22, 33, 62, 0.75);
      border: 1px solid rgba(78, 204, 163, 0.25);
      border-radius: 16px;
      text-align: center;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.75rem; }
    ul { list-style: none; display: grid; gap: 0.75rem; }
    a {
      display: block;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      color: #4ecca3;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid rgba(78, 204, 163, 0.35);
    }
    a:hover { background: rgba(78, 204, 163, 0.12); }
  </style>
</head>
<body>
  <main>
    <h1>游戏合集</h1>
    <ul>
      <li><a href="./guess-number-game/">猜数字（1-100）</a></li>
      <li><a href="./index.html">双球对战</a></li>
    </ul>
  </main>
</body>
</html>
